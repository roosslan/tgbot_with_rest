name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  build:
    name: Сборка и тесты (Ubuntu 24.04, Qt 6.10.1)
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.10.1
      QT_ROOT: ${{ github.workspace }}/../Qt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Кэш Qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-httpserver-websockets

      - name: Зависимости
        run: bash ci/install-deps.sh

      - name: Сборка и тесты
        run: bash ci/build.sh

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа (без публикации)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-img/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
