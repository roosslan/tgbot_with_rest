services:
  chanserv:
    env_file: 
      - ./run.env
    build:
      context: ..
      dockerfile: docker-img/Dockerfile
    environment:
      CHANSERV_CONFIG: ${CHANSERV_CONFIG}
      CHANSERV_LOGDIR: ${CHANSERV_LOGDIR}
    volumes:
      - /home/rasa:/home/rasa
      - /home/rasa/logs:/root/logs
    ports:
     - "65053:53000"
     - "65179:17900"
     - "65080:8080"
    container_name: chanserv

