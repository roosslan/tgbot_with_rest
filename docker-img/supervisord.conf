[supervisord]
nodaemon=true

; Сессионная шина DBus для связи chanserv и listchecker (адрес в DBUS_SESSION_BUS_ADDRESS, см. Dockerfile)
[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=unix:path=/run/chanserv-dbus.sock
priority=1

; Бот и listchecker стартуют после появления сокета шины
[program:chanserv]
command=/bin/sh -c 'until [ -S /run/chanserv-dbus.sock ]; do sleep 0.2; done; exec /opt/chanserv/bin/chanserv'
directory=/root
priority=10

[program:listchecker]
command=/bin/sh -c 'until [ -S /run/chanserv-dbus.sock ]; do sleep 0.2; done; exec /opt/chanserv/listchecker/bin/listchecker'
directory=/root
priority=20
