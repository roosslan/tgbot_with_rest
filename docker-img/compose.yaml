services:
  chanserv:
    env_file: 
      - ./run.env
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      CHANSERV_CONFIG: ${CHANSERV_CONFIG}
      CHANSERV_LOGDIR: ${CHANSERV_LOGDIR}
    volumes:
      - /volume3/rasa/chanserv:/root/
      - /volume3/rasa/chanserv/logs:/root/logs
    ports:
     - "65053:53"
     - "65179:179"
     - "65080:8080"
    container_name: chanserv